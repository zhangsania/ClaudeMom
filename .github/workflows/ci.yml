# 手动运行 macOS / Windows 的平台构建检查；推送源代码不会自动执行。
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx-sys 把预编译库下到 target/sherpa-onnx-prebuilt/<包名>/lib，构建脚本只看 lib 目录在不在。
      # rust-cache 恢复出来的缓存里目录还在、库文件却没了：构建脚本不重新下载，链接时找不到 sherpa-onnx-c-api。
      # 库文件不在时删掉整个目录和 sherpa-onnx-sys 的构建记录（新旧两种 target 布局），让构建脚本重跑、重新下载。
      - name: sherpa-onnx 预编译库
        shell: bash
        run: |
          if ! compgen -G "target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api*" > /dev/null; then
            rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys* target/*/.fingerprint/sherpa-onnx-sys* \
              target/*/*/build/sherpa-onnx-sys* target/*/*/.fingerprint/sherpa-onnx-sys*
          fi

      - name: 前端：类型检查、测试、构建
        working-directory: apps/claude-mom
        run: |
          npm ci
          npm run check
          npm test
          npm run vite:build

      - name: Rust 测试
        run: cargo test --workspace

      - name: 本地兼容服务（Node）测试
        if: matrix.platform == 'macos-latest'
        working-directory: crates/claude-local/runtime
        run: |
          bash scripts/gen-ca.sh
          node --test --test-timeout=120000 managed.test.mjs proxy.test.mjs scripts/*.test.mjs

      - name: release 编译
        run: cargo build --release -p claude-mom
