name: Release

# 发版入口是推送 v* tag（本地用 `node scripts/release.mjs <版本号>`）：
#   prepare  校验版本号文件与 tag 一致，从 CHANGELOG.md 截取说明，建草稿 Release
#   构建     默认只构建 Windows；CLAUDEMOM_RELEASE_MACOS=true 时同时构建 macOS
#   收尾     生成 SHA256SUMS.txt 与自动更新用的 latest.json，附件齐了才公开发布
# 草稿期间用户看不到这一版，所选平台全部成功后才公开。
# 补跑某个平台用 workflow_dispatch。
#
# 签名：更新包用 TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)；macOS 正式签名 + 公证用下面这些 Secret
# （与 CodexPlusPlus 同名同值），缺任何一个就失败，不发未签名的包：
#   MACOS_CERT_P12（base64）、MACOS_CERT_PASSWORD、MACOS_SIGNING_IDENTITY、
#   APPLE_API_KEY_P8（base64）、APPLE_API_KEY_ID、APPLE_API_ISSUER_ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v0.1.4"
        required: true
        type: string
      platform:
        description: "需要重新构建的平台"
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      publish:
        description: "Release 还是草稿时，附件与更新元数据齐备后公开发布"
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

# 同一个 tag 的两轮不要并发上传附件。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft Release
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.release.outputs.is_draft }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify version files match tag
        # 只拦推 tag 的新发版；补跑旧 tag 时那一版可能还没有这些文件或校验脚本。
        if: github.event_name == 'push'
        run: node scripts/release-meta.mjs check "$RELEASE_TAG"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/release-meta.mjs notes "$RELEASE_TAG" > notes.md; then
            echo "::warning::CHANGELOG.md 里没有 ${RELEASE_TAG#v} 这一节，改用 GitHub 自动生成的说明"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > notes.md
          fi
          cat notes.md

      - name: Create or update draft Release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing)
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "YClaude $RELEASE_TAG" --notes-file notes.md
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              # 事先手动建好的草稿：推 tag 时以 CHANGELOG 为准刷新说明；补跑时保留手改过的说明。
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --verify-tag --title "YClaude $RELEASE_TAG" --notes-file notes.md
              fi
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$RELEASE_TAG 已公开发布，说明保持不动，只补附件"
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  windows:
    name: Windows installer
    needs: prepare
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        working-directory: apps/claude-mom
        run: npm ci

      - name: 构建
        working-directory: apps/claude-mom
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: 收集附件
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # 工作区根目录的 target/（Cargo workspace 在仓库根）。
          src="target/release/bundle/nsis/YClaude_${version}_x64-setup.exe"
          for file in "$src" "$src.sig"; do
            [ -s "$file" ] || { echo "缺少构建产物：$file" >&2; exit 1; }
          done
          mkdir -p dist
          cp "$src" "$src.sig" dist/
          ls -l dist

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: macOS (universal)
    needs: prepare
    if: (github.event_name == 'push' && vars.CLAUDEMOM_RELEASE_MACOS == 'true') || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        working-directory: apps/claude-mom
        run: npm ci

      - name: 签名与公证凭据
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "error: 签名 / 公证 Secret 不全（${missing# }），拒绝产出未签名或未公证的发布包" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # Tauri CLI 读这些变量：导入证书到临时钥匙串、用该身份签名、提交公证并钉上票据。
          {
            echo "APPLE_CERTIFICATE=$MACOS_CERT_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      - name: 构建
        working-directory: apps/claude-mom
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target universal-apple-darwin

      - name: 校验签名与公证
        shell: bash
        run: |
          set -euo pipefail
          app="target/universal-apple-darwin/release/bundle/macos/YClaude.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # 能通过 Gatekeeper 评估说明已签名且公证过（ad-hoc 签名在这里会被拒）。
          spctl --assess --type execute --verbose=2 "$app"

      - name: 收集附件
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bundle="target/universal-apple-darwin/release/bundle"
          dmg="$bundle/dmg/YClaude_${version}_universal.dmg"
          tarball="$bundle/macos/YClaude.app.tar.gz"
          for file in "$dmg" "$tarball" "$tarball.sig"; do
            [ -s "$file" ] || { echo "缺少构建产物：$file" >&2; exit 1; }
          done
          mkdir -p dist
          cp "$dmg" dist/
          cp "$tarball" dist/YClaude_universal.app.tar.gz
          cp "$tarball.sig" dist/YClaude_universal.app.tar.gz.sig
          ls -l dist

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  latest-json:
    name: Upload checksums, latest.json and publish
    # 单平台补跑时另一个 job 会跳过；成功或跳过才允许更新元数据。
    if: always() && needs.prepare.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    needs:
      - prepare
      - windows
      - macos
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REQUIRE_MACOS: ${{ needs.macos.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          # 按 Release 上现有的全部附件重算，单平台补跑后也是完整清单。
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'YClaude*' --dir assets --clobber
          ls -l assets

      - name: Verify assets and generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json body,tagName > release.json
          node scripts/release-assets.mjs
          (cd assets && sha256sum YClaude* | sort -k2 > ../SHA256SUMS.txt)

      - name: Upload release metadata
        shell: bash
        run: gh release upload "$RELEASE_TAG" SHA256SUMS.txt latest.json --clobber --repo "$REPO"

      - name: Publish Release
        # 公开草稿必须有本轮成功构建的 Windows 包；启用 macOS 时也必须成功。
        if: needs.prepare.outputs.is_draft == 'true' && (github.event_name == 'push' || inputs.publish) && needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
        shell: bash
        run: |
          set -euo pipefail
          # 只有版本最新时才标 Latest：补发的旧版本不能抢走 Latest，
          # 否则「检查更新」读 releases/latest/download/latest.json 会回退到旧版。
          published=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName')
          newest=$(printf '%s\n' "$RELEASE_TAG" $published | sed 's/^[vV]//' | sort -V | tail -n 1)
          if [ "$newest" = "${RELEASE_TAG#[vV]}" ]; then
            latest=true
          else
            latest=false
            echo "::notice::已有更新的 v$newest，$RELEASE_TAG 发布但不标 Latest"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest" --verify-tag --repo "$REPO"
