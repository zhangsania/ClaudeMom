<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClaudeMom 宣传片</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(0,0,0,.55); }
  #ui.hidden { display: none; }
  button { font: 600 22px -apple-system, "PingFang SC", sans-serif; padding: 16px 40px; border-radius: 40px; border: 0; cursor: pointer; color: #fff; background: linear-gradient(90deg, #ff9a52, #ff4d5e); min-width: 280px; }
  button.ghost { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); }
  #status { color: #e9d9cf; font-size: 16px; min-height: 22px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="play">▶ 播放</button>
  <button id="rec" class="ghost">● 导出视频</button>
  <div id="status"></div>
</div>
<script>
const W = 1920, H = 1080, BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4, DUR = 54;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const F = '-apple-system,"SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif';
const MONO = '"SF Mono",Menlo,monospace';
const ORANGE = '#ff7a45';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);

// ---------- drawing helpers ----------
const font = (size, w = 700, fam = F) => `${w} ${size}px ${fam}`;
function text(s, x, y, size, o = {}) {
  g.save();
  g.font = font(size, o.w ?? 700, o.fam ?? F);
  g.textAlign = o.align ?? 'center';
  g.textBaseline = 'middle';
  g.letterSpacing = (o.ls ?? 0) + 'px';
  g.globalAlpha *= o.a ?? 1;
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.blur ?? 30; }
  g.fillStyle = o.c ?? '#fff';
  g.fillText(s, x, y);
  g.restore();
}
function gtext(s, x, y, size, amt, o = {}) {
  if (amt > 0.5) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    text(s, x - amt, y, size, { ...o, c: 'rgba(255,40,90,0.85)', glow: null });
    text(s, x + amt, y + amt * 0.2, size, { ...o, c: 'rgba(0,220,255,0.85)', glow: null });
    g.restore();
  }
  text(s, x, y, size, o);
}
function measure(s, size, w = 700, fam = F) { g.save(); g.font = font(size, w, fam); g.letterSpacing = '0px'; const m = g.measureText(s).width; g.restore(); return m; }
// parts: [{s, c}] where c === 'hot' gets the orange gradient; returns [x0, x1] of each part
function richLine(parts, x, y, size, o = {}) {
  const ws = parts.map(p => measure(p.s, size, o.w ?? 800));
  const total = ws.reduce((a, b) => a + b, 0);
  let cx = o.align === 'left' ? x : x - total / 2;
  const spans = [];
  parts.forEach((p, i) => {
    const c = p.c === 'hot' ? gradOrange(cx, y - size / 2, cx + ws[i], y + size / 2) : p.c;
    text(p.s, cx, y, size, { align: 'left', c, w: o.w ?? 800 });
    spans.push([cx, cx + ws[i]]);
    cx += ws[i];
  });
  return spans;
}
function gradOrange(x0, y0, x1, y1) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, '#ffc27a'); gr.addColorStop(0.5, '#ff7a45'); gr.addColorStop(1, '#ff3d6e');
  return gr;
}
function radial(x, y, r, color) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function lock(cx, cy, s, c) {
  g.save(); g.translate(cx, cy);
  g.strokeStyle = c; g.fillStyle = c; g.lineWidth = s * 0.12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-0.26 * s, 0); g.lineTo(-0.26 * s, -0.28 * s);
  g.arc(0, -0.28 * s, 0.26 * s, Math.PI, 0); g.lineTo(0.26 * s, 0); g.stroke();
  g.beginPath(); g.roundRect(-0.4 * s, -0.02 * s, 0.8 * s, 0.62 * s, 0.1 * s); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.45)';
  g.beginPath(); g.arc(0, 0.24 * s, 0.07 * s, 0, 7); g.fill();
  g.fillRect(-0.025 * s, 0.24 * s, 0.05 * s, 0.14 * s);
  g.restore();
}
function check(cx, cy, r) {
  g.save(); g.translate(cx, cy);
  g.fillStyle = gradOrange(-r, -r, r, r);
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = r * 0.17; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-0.42 * r, 0.02 * r); g.lineTo(-0.12 * r, 0.32 * r); g.lineTo(0.45 * r, -0.28 * r); g.stroke();
  g.restore();
}
function keyIcon(cx, cy, s) {
  g.save(); g.translate(cx, cy);
  g.strokeStyle = ORANGE; g.lineWidth = s * 0.16; g.lineCap = 'round';
  g.beginPath(); g.arc(-s * 0.35, 0, s * 0.32, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(-s * 0.03, 0); g.lineTo(s * 0.75, 0);
  g.moveTo(s * 0.5, 0); g.lineTo(s * 0.5, s * 0.3); g.moveTo(s * 0.72, 0); g.lineTo(s * 0.72, s * 0.24); g.stroke();
  g.restore();
}

// ---------- timing shared by picture and sound ----------
const isSilent = t => (t >= 21.5 && t < 22) || (t >= 29.5 && t < 30) || (t >= 33.5 && t < 34) || (t >= 37.5 && t < 38) || (t >= 43.5 && t < 44);
function kick(t) {
  if (t < 8 || t >= 48 || isSilent(t)) return 0;
  return Math.exp(-((t - 8) % BEAT) * 9);
}
const IMPACTS = [[8, 1, 26], [22, 0.45, 14], [30, 0.45, 14], [34, 0.4, 12], [38, 0.3, 10], [44, 0.5, 14], [45, 0.4, 10], [46, 0.4, 10], [47, 0.4, 10], [48, 1, 22]];
const GLITCHES = [[3.7, 4.05], [7.85, 8.0], [11.85, 12.05], [15.8, 16.05], [21.75, 22.05], [29.75, 30.05], [33.8, 34.05], [37.8, 38.05], [40.85, 41.05], [43.8, 44.05]];

// ---------- background ----------
let vignette, scan;
function bgLayer(t) {
  g.fillStyle = '#0a0807'; g.fillRect(0, 0, W, H);
  const k = kick(t);
  radial(W * 0.5, H * 0.66, 1000, `rgba(217,119,87,${0.16 + 0.14 * k})`);
  radial(W * 0.12, H * 0.15, 760, 'rgba(255,80,60,0.09)');
  radial(W * 0.9, H * 0.2, 760, 'rgba(255,170,80,0.07)');
  // perspective grid floor
  const hz = H * 0.64;
  g.save();
  g.beginPath(); g.rect(0, hz, W, H - hz); g.clip();
  g.lineWidth = 1.5;
  for (let i = -16; i <= 16; i++) {
    g.strokeStyle = `rgba(255,120,80,${0.22 + 0.1 * k})`;
    g.beginPath(); g.moveTo(W / 2 + i * 30, hz); g.lineTo(W / 2 + i * 240, H); g.stroke();
  }
  const speed = t < 8 ? 0.5 : 1.6;
  const f = frac(t * speed);
  for (let i = 0; i < 14; i++) {
    const p = (i + f) / 14, y = hz + (H - hz) * Math.pow(p, 2.4);
    g.strokeStyle = `rgba(255,120,80,${0.08 + 0.4 * p})`;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  const fade = g.createLinearGradient(0, hz, 0, hz + 180);
  fade.addColorStop(0, '#0a0807'); fade.addColorStop(1, 'rgba(10,8,7,0)');
  g.fillStyle = fade; g.fillRect(0, hz, W, 180);
  g.restore();
  // horizon glow line
  const hl = g.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, 'rgba(255,120,70,0)'); hl.addColorStop(0.5, `rgba(255,140,90,${0.5 + 0.3 * k})`); hl.addColorStop(1, 'rgba(255,120,70,0)');
  g.fillStyle = hl; g.fillRect(0, hz - 1, W, 2);
  // embers
  for (let i = 0; i < 110; i++) {
    const r1 = hash(i), r2 = hash(i + 99), r3 = hash(i + 7);
    const sp = 30 + r2 * 110 * (t < 8 ? 0.6 : 1.4);
    const y = H + 20 - ((t * sp + r1 * 1300) % (H + 80));
    const x = r3 * W + Math.sin(t * (0.5 + r1) + i) * 30;
    g.fillStyle = `rgba(255,${140 + (r1 * 80 | 0)},90,${(0.15 + 0.55 * hash(i + 3)) * (0.7 + 0.3 * k)})`;
    g.beginPath(); g.arc(x, y, 1 + r2 * 2.4, 0, 7); g.fill();
  }
}

// ---------- scenes ----------
function s1(t) {
  if (t >= 4.05) return;
  const a = 1 - seg(t, 3.8, 4.0);
  g.save(); g.globalAlpha = a;
  const fy = 640, fw = 980, fh = 130, fx = W / 2 - fw / 2;
  const pin = eOut(seg(t, 0.1, 0.7));
  g.save(); g.globalAlpha *= pin; g.translate(0, (1 - pin) * 40);
  rr(fx, fy - fh / 2, fw, fh, 26, 'rgba(25,20,18,0.92)', 'rgba(255,122,69,0.55)', 2);
  text('API KEY', fx + 30, fy - fh / 2 - 30, 24, { align: 'left', c: 'rgba(255,180,140,0.8)', ls: 6, w: 700, fam: MONO });
  keyIcon(fx + 62, fy, 34);
  const full = 'sk-ant-api03-••••••••••••';
  const n = Math.floor(seg(t, 0.6, 1.9) * full.length);
  const shown = full.slice(0, n);
  const tw = measure(shown, 54, 500, MONO);
  text(shown, fx + 120, fy, 54, { align: 'left', fam: MONO, w: 500, c: '#f4e9e1' });
  if (n < full.length || Math.floor(t * 2.5) % 2 === 0) { g.fillStyle = ORANGE; g.fillRect(fx + 120 + tw + 6, fy - 30, 4, 60); }
  g.restore();
  const h = seg(t, 1.95, 2.4);
  if (h > 0) {
    g.save(); g.globalAlpha *= h;
    const jitter = t > 3.6 ? 26 * hash(Math.floor(t * 30)) : 0;
    gtext('只有一个 API Key？', W / 2, 400 + (1 - eOut(h)) * 30, 130, 30 * (1 - h) + jitter, { w: 800 });
    g.restore();
  }
  const s = seg(t, 2.6, 3.0);
  if (s > 0) text('那 Claude 桌面版，你只能用一半', W / 2, 860, 44, { c: 'rgba(240,225,215,0.75)', w: 500, a: s });
  g.restore();
}

const LOCKED = ['Cowork', '电脑控制', '语音输入', '中文界面'];
function s2(t) {
  if (t < 3.9 || t >= 8.0) return;
  const suck = eIn(seg(t, 7.35, 8.0));
  g.save(); g.globalAlpha = seg(t, 3.9, 4.1) * (1 - seg(t, 7.85, 8.0));
  const ti = seg(t, 4.0, 4.35);
  g.save(); g.globalAlpha *= ti * (1 - suck);
  gtext('填 API Key 进去，入口直接没了', W / 2, 250 - (1 - eOut(ti)) * 30, 84, 18 * (1 - ti), { w: 800 });
  g.restore();
  const tw = 340, th = 300, gap = 44, x0 = W / 2 - (4 * tw + 3 * gap) / 2, cy = 590;
  LOCKED.forEach((name, i) => {
    const st = 4.5 + i * 0.5, p = seg(t, st, st + 0.35);
    if (p <= 0) return;
    const shake = t > st + 0.15 ? Math.sin((t - st) * 60) * 14 * Math.exp(-(t - st - 0.15) * 6) : 0;
    const cx = lerp(x0 + i * (tw + gap) + tw / 2 + shake, W / 2, suck);
    const y = lerp(cy, H / 2, suck);
    const sc = eBack(p) * (1 - suck * 0.85);
    const red = Math.exp(-Math.max(0, t - st - 0.15) * 3);
    g.save(); g.translate(cx, y); g.scale(sc, sc); g.rotate(suck * (i - 1.5) * 0.6);
    rr(-tw / 2, -th / 2, tw, th, 28, 'rgba(28,24,22,0.94)', `rgba(${lerp(80, 255, red) | 0},${lerp(72, 60, red) | 0},${lerp(66, 70, red) | 0},0.9)`, 3);
    lock(0, -50, 110, '#5d5550');
    text(name, 0, 68, 44, { w: 700, c: '#8a817b' });
    text('不可用', 0, 112, 26, { w: 500, c: `rgba(255,90,90,${0.45 + 0.55 * red})` });
    g.restore();
  });
  const w = seg(t, 6.5, 6.7);
  if (w > 0) {
    const sc = lerp(2.2, 1, eExpo(w));
    g.save(); g.translate(W / 2, 880); g.scale(sc, sc); g.globalAlpha *= w * (1 - suck);
    rr(-340, -44, 680, 88, 44, 'rgba(255,60,60,0.12)', 'rgba(255,80,80,0.9)', 3);
    text('第三方 API 模式 · 功能缺一半', 0, 2, 40, { w: 700, c: '#ff6b6b' });
    g.restore();
  }
  // energy gathering at center before the drop
  const e = seg(t, 7.2, 8.0);
  if (e > 0) radial(W / 2, H / 2, 200 + 700 * e, `rgba(255,${200 - 60 * e | 0},140,${0.8 * eIn(e)})`);
  g.restore();
}

function s3(t) {
  if (t < 8 || t >= 12.05) return;
  const lt = t - 8, out = eIn(seg(t, 11.7, 12.0)), LY = 420;
  g.save(); g.globalAlpha = 1 - out;
  g.translate(W / 2, H / 2); g.scale(1 + out * 0.7, 1 + out * 0.7); g.translate(-W / 2, -H / 2);
  for (let i = 0; i < 3; i++) {
    const p = seg(lt, i * 0.08, 1.3 + i * 0.08);
    if (p <= 0 || p >= 1) continue;
    g.strokeStyle = `rgba(255,${170 - i * 35},90,${(1 - p) * 0.85})`;
    g.lineWidth = 34 * (1 - p) + 2;
    g.beginPath(); g.arc(W / 2, LY, eExpo(p) * 1400, 0, 7); g.stroke();
  }
  for (let i = 0; i < 160; i++) {
    const life = 0.8 + hash(i + 9) * 1.6, p = lt / life;
    if (p >= 1) continue;
    const ang = hash(i) * Math.PI * 2, d = (300 + hash(i + 50) * 1200) * eOut(p);
    g.fillStyle = `rgba(255,${160 + hash(i + 4) * 90 | 0},${90 + hash(i + 6) * 70 | 0},${1 - p})`;
    g.beginPath(); g.arc(W / 2 + Math.cos(ang) * d, LY + Math.sin(ang) * d, (1 - p) * (2 + hash(i + 3) * 5), 0, 7); g.fill();
  }
  const k = kick(t), lp = seg(lt, 0, 0.7), sz = 360 * eBack(lp);
  radial(W / 2, LY, 440 + 90 * k, `rgba(255,110,60,${0.32 + 0.25 * k})`);
  if (sz > 0) {
    g.save(); g.translate(W / 2, LY); g.rotate((1 - eOut(lp)) * -0.6);
    const s = sz * (1 + 0.03 * k);
    g.drawImage(IMG.icon, -s / 2, -s / 2, s, s);
    g.restore();
  }
  const name = 'ClaudeMom', size = 160;
  const total = measure(name, size, 800);
  let x = W / 2 - total / 2;
  const mx0 = x + measure('Claude', size, 800);
  const hot = gradOrange(mx0, 640, mx0 + measure('Mom', size, 800), 820);
  for (let i = 0; i < name.length; i++) {
    const wch = measure(name[i], size, 800), p = seg(lt, 0.9 + i * 0.06, 1.25 + i * 0.06);
    if (p > 0) text(name[i], x + wch / 2, 720 - (1 - eBack(p)) * 90, size, { w: 800, a: p, c: i >= 6 ? hot : '#fff' });
    x += wch;
  }
  const sp = seg(lt, 2.0, 2.5);
  if (sp > 0) text('Claude 桌面版 · 登录模式 · 用你自己的 Key', W / 2, 840 + (1 - eOut(sp)) * 20, 46, { w: 500, c: '#ead8cb', a: sp, ls: 2 });
  g.restore();
}

function s4(t) {
  if (t < 12 || t >= 16.05) return;
  const words = [['把', 12], ['API Key', 12.5], ['变成', 13], ['登录模式', 13.5]];
  if (t < 14) {
    let cur = null;
    for (const w of words) if (t >= w[1]) cur = w;
    const p = seg(t, cur[1], cur[1] + 0.18), sc = lerp(1.8, 1, eExpo(p));
    const hotWord = cur[0] === '登录模式';
    g.save(); g.translate(W / 2, H / 2 - 20); g.scale(sc, sc);
    gtext(cur[0], 0, 0, hotWord ? 300 : 280, (1 - p) * 44, { w: 800, c: hotWord ? gradOrange(-600, -150, 600, 150) : '#fff' });
    g.restore();
    g.fillStyle = `rgba(255,120,70,${0.22 * (1 - p)})`; g.fillRect(0, 0, W, H);
    return;
  }
  const out = seg(t, 15.85, 16.0);
  g.save(); g.globalAlpha = 1 - out;
  const p = seg(t, 14, 14.4), y = 470 + (1 - eOut(p)) * 50;
  g.save(); g.globalAlpha *= p;
  const spans = richLine([{ s: '把 API Key 变成', c: '#fff' }, { s: '「登录模式」', c: 'hot' }], W / 2, y, 130);
  g.restore();
  const u = eOut(seg(t, 14.35, 14.8));
  if (u > 0) {
    const [a, b] = spans[1];
    g.fillStyle = gradOrange(a, 0, b, 0);
    g.fillRect(a + 40, y + 88, (b - a - 80) * u, 10);
  }
  const s = seg(t, 14.8, 15.2);
  if (s > 0) text('Claude 看到的是已登录账号 · 模型请求走你的 Base URL + Key', W / 2, 670 + (1 - eOut(s)) * 20, 40, { w: 500, c: '#d9cbc1', a: s });
  g.restore();
}

function desktopCard(cx, cy, p) {
  if (p <= 0) return;
  g.save(); g.translate(cx, cy); const s = eBack(p); g.scale(s, s);
  rr(-200, -135, 400, 270, 24, 'rgba(30,26,24,0.96)', 'rgba(255,255,255,0.16)', 2);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(-170 + i * 24, -108, 7, 0, 7); g.fill(); });
  ['Chat', 'Code', 'Cowork'].forEach((s2, i) => {
    const x = -120 + i * 120;
    rr(x - 54, -72, 108, 42, 21, i === 0 ? 'rgba(255,122,69,0.22)' : 'rgba(255,255,255,0.06)');
    text(s2, x, -51, 22, { w: 600, c: i === 0 ? '#ffb08a' : '#cfc5bd' });
  });
  text('Claude Desktop', 0, 22, 40, { w: 800 });
  text('原版客户端 · 不改一行', 0, 74, 26, { w: 500, c: '#a69b93' });
  g.restore();
}
function serverCard(cx, cy, p) {
  if (p <= 0) return;
  g.save(); g.translate(cx, cy); const s = eBack(p); g.scale(s, s);
  rr(-200, -135, 400, 270, 24, 'rgba(30,26,24,0.96)', 'rgba(255,255,255,0.16)', 2);
  for (let i = 0; i < 3; i++) {
    rr(-70, -108 + i * 30, 140, 22, 6, 'rgba(255,255,255,0.08)', 'rgba(255,255,255,0.18)', 1.5);
    g.fillStyle = i === 1 ? '#28c840' : ORANGE; g.beginPath(); g.arc(-52, -97 + i * 30, 4, 0, 7); g.fill();
  }
  text('你的上游', 0, 22, 40, { w: 800 });
  text('Base URL + API Key', 0, 74, 25, { w: 500, c: '#ffab83', fam: MONO });
  g.restore();
}
function link(x1, x2, y, p, t, hot) {
  if (p <= 0) return;
  const xe = lerp(x1, x2, p);
  g.save();
  g.strokeStyle = 'rgba(255,140,100,0.5)'; g.lineWidth = 3; g.setLineDash([10, 10]); g.lineDashOffset = -t * 60;
  g.beginPath(); g.moveTo(x1, y); g.lineTo(xe, y); g.stroke();
  g.restore();
  if (p < 1) return;
  for (let i = 0; i < 3; i++) {
    const a = frac(t * 0.9 + i / 3), b = frac(-t * 0.9 + i / 3 + 0.17);
    radial(lerp(x1, x2, a), y - 12, 22, hot ? 'rgba(255,150,80,0.9)' : 'rgba(255,230,210,0.85)');
    radial(lerp(x1, x2, b), y + 12, 18, 'rgba(255,110,70,0.8)');
  }
}

    }
    status.textContent = '编码 MP4…';
    status.textContent = '已导出 ' + await send('POST', '/encode');
  } catch (e) {
    status.textContent = '导出失败：' + e.message;
  }
  buttons.forEach(b => b.disabled = false);
}
document.getElementById('play').onclick = play;
document.getElementById('rec').onclick = exportVideo;
const q = new URLSearchParams(location.search).get('t');
if (q !== null) { ui.classList.add('hidden'); window.renderAt(+q); } else ready.then(() => render(9.6));
</script>
